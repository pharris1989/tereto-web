<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te Reto App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky white nav with trapezoid tab for the active profile; each view is a full-width band
   (landing sections, themed login, themed dashboards). Single light look, colors taken from the Te Reto designs. */
:root{
  color-scheme: light;
  --navy:#0E2233; --ink:#1d2a33; --muted:#5b6670; --line:#d9dde0; --white:#fff; --paper:#f4f4f5;
  --yellow:#FBBF3A; --yellow-soft:#FCE6A4; --pink:#EE4A62; --mustard:#ECBC48; --teal:#3FAE97; --mint:#86D29E; --clay:#E2834C;
  --a-fam:#F76D7E; --a-est:#FE8A55; --a-doc:#63C3B3; --a-ins:#F8CF6B;
  /* role theme (overridden per view) */
  --r1:#F7A23B; --r2:#F25A2A; --rbg1:#FCD88A; --rbg2:#F0C09A; --rside:#4E7A78; --rtext:#0E2233; --rsoft:#e6efed;
  --display:"Lexend", "Trebuchet MS", system-ui, sans-serif;
  --body:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  --gutter:max(16px, env(safe-area-inset-left, 0px));
}
.t-est{--r1:#F7A23B;--r2:#F25A2A;--rbg1:#FCD88A;--rbg2:#EFBF9B;--rside:#C46A3C;--rtext:#0E2233;--rsoft:#fff3e4}
.t-doc{--r1:#5CCB9A;--r2:#3DB59B;--rbg1:#A6DCE2;--rbg2:#AEE3B9;--rside:#4E7A78;--rtext:#0E2233;--rsoft:#e3ece9}
.t-fam{--r1:#D86C6C;--r2:#B5504C;--rbg1:#E4B3A5;--rbg2:#DFB0BD;--rside:#CD7470;--rtext:#0E2233;--rsoft:#ecdfe2}
.t-ins{--r1:#9A78B8;--r2:#7E5B99;--rbg1:#C3C0C6;--rbg2:#CDB8DA;--rside:#A48AB0;--rtext:#2B0A47;--rsoft:#e4dfe8}

*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--white);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--white)}
h1,h2,h3,h4{font-family:var(--display);color:var(--navy);margin:0;text-wrap:balance;line-height:1.12}
p{margin:0}
button,input,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gutter);padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);font-size:.95rem}

/* ---------- NAV ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--white);border-bottom:1px solid #eee}
.nav .wrap{display:flex;align-items:flex-end;gap:12px;min-height:84px}
.logo{display:flex;align-items:center;padding-bottom:10px;flex:none;background:none;border:0}
.logo img{height:58px;width:auto}
.tabs{display:flex;flex:1;justify-content:space-around;gap:4px;align-items:flex-end;min-width:0}
.tab{position:relative;background:none;border:0;padding:0 18px 22px;font-family:var(--display);font-weight:600;color:var(--navy);font-size:.95rem;white-space:nowrap;height:62px;display:flex;align-items:flex-end;justify-content:center;min-width:120px}
.tab::before{content:"";position:absolute;inset:6px 0 12px;clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);background:linear-gradient(90deg,var(--rbg1),var(--rbg2));opacity:0;transition:opacity .2s}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--r2);opacity:0;transition:opacity .2s}
.tab span{position:relative}
.tab:hover::before{opacity:.45}
.tab[aria-current="page"]::before,.tab[aria-current="page"]::after{opacity:1}
.nav-right{display:flex;align-items:center;gap:18px;padding-bottom:14px;flex:none}
.link-btn{background:none;border:0;font-family:var(--display);font-weight:600;color:var(--navy)}
.pill{display:flex;align-items:center;gap:14px;background:var(--yellow);color:#fff;border:0;border-radius:40px;padding:6px 34px 6px 8px;font-family:var(--display);font-weight:700;min-width:170px;transition:transform .15s, filter .15s}
.pill:hover{transform:translateY(-1px);filter:brightness(1.04)}
.pill .av{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center}
.pill .av svg{width:24px;height:24px;fill:var(--yellow)}
.app .pill{background:var(--r2)} .app .pill .av svg{fill:var(--r2)}
.t-est .pill{background:var(--yellow)} .t-est .pill .av svg{fill:var(--yellow)}
.enter{position:relative}
.pill .chev{display:grid;margin-left:auto}
.pill .chev svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.pill[aria-expanded="true"] .chev svg{transform:rotate(180deg)}
.enter-menu{position:absolute;right:0;top:calc(100% + 12px);width:min(370px, calc(100vw - 32px));background:#E6C274;border:2px solid #D8AE55;border-radius:24px;box-shadow:0 18px 40px rgba(120,84,10,.22);padding:14px;display:grid;gap:2px;z-index:70;animation:drop .18s ease-out}
[hidden]{display:none!important}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.enter-menu>button{all:unset;cursor:pointer;display:flex;gap:18px;align-items:center;padding:10px 12px;border-radius:16px;transition:background .15s}
.enter-menu>button:hover,.enter-menu>button:focus-visible{background:rgba(255,255,255,.38)}
.enter-menu>button:focus-visible{outline:2px solid var(--navy)}
.enter-menu .ic{width:54px;height:54px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(120,84,10,.18)}
.enter-menu .ic img{width:50px;height:50px;object-fit:contain}
.enter-menu b{display:block;font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--ink)}
.enter-menu small{color:#5a4a26;font-size:.85rem}
.enter-foot{border-top:1px solid #D8AE55;margin-top:6px;padding:10px 12px 2px;font-size:.82rem;color:#5a4a26}
.enter-foot .link-btn{color:var(--navy);padding:0;text-decoration:underline}
.enter-menu.pick{position:static;width:auto;border:0;box-shadow:none;padding:0;animation:none;background:none}
.enter-menu.pick>button:hover,.enter-menu.pick>button:focus-visible{background:#FBF1DC}
.enter-menu.pick small{color:var(--muted)}
.menu-toggle{display:none;background:none;border:0;padding:10px;margin-bottom:12px}
.menu-toggle svg{width:28px;height:28px;stroke:var(--navy)}
.usermenu{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));top:78px;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.15);padding:8px;min-width:200px}
.usermenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px}
.usermenu button:hover{background:var(--paper)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:12px;border-radius:40px;padding:12px 32px;font-family:var(--display);font-weight:700;font-size:1.05rem;border:2px solid var(--yellow);transition:transform .15s, box-shadow .15s, background .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(251,191,58,.35)}
.btn-solid{background:var(--yellow);color:#fff}
.btn-ghost{background:#fff;color:var(--yellow)}
.btn .dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.45);display:grid;place-items:center}
.btn .dot svg{width:10px;height:10px;fill:#fff}

/* ---------- LANDING ---------- */
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-block:56px 70px}
.hero h1{font-size:clamp(2.6rem,5.4vw,4.6rem);font-weight:700;letter-spacing:-.01em}
.hero h2{color:var(--yellow);font-size:clamp(1.7rem,3.2vw,2.75rem);font-weight:700;margin-top:14px;max-width:14ch}
.hero p{max-width:56ch;margin-top:56px;font-size:1rem;color:var(--ink)}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.hero-art{position:relative;aspect-ratio:1/1;max-width:100%}
.hero-art .sq{position:absolute;inset:4% 8% 12% 0;border-radius:36px;background:linear-gradient(90deg,#F15A24 0%,#F7931E 40%,#F2D06B 65%,#5FC2B5 100%);overflow:hidden}
.hero-art .sq::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.08) 0 6px,transparent 6px 18px)}
.hero-art img{position:absolute;right:-2%;bottom:-4%;width:92%;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18));animation:bob 6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(-1.5deg)}}

.pillars{display:grid;grid-template-columns:repeat(3,1fr)}
.pillar{display:flex;gap:22px;padding:32px 34px;color:#fff;position:relative;overflow:hidden}
.pillar::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.12) 1px,transparent 0) 0 0/8px 8px}
.pillar svg{width:52px;height:52px;flex:none;fill:none;stroke:#fff;stroke-width:1.6;position:relative}
.pillar h3{color:#fff;font-size:1.25rem;margin-bottom:8px}
.pillar p{font-size:.82rem;line-height:1.6;position:relative}
.pillar>div{position:relative}
.pillar:nth-child(1){background:var(--pink)} .pillar:nth-child(2){background:var(--mustard)} .pillar:nth-child(3){background:var(--teal)}

.reto{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1fr)}
.reto .photo{background:url(assets/foto-lectura.jpg) center/cover;min-height:420px}
.reto .copy{padding:40px clamp(20px,4vw,56px) 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.reto h2{font-size:clamp(1.8rem,3vw,2.6rem)}
.reto .copy>p{max-width:62ch}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:10px}
.feat button{all:unset;cursor:pointer;border-radius:8px;padding:16px 20px 30px;color:#fff;position:relative;transition:transform .2s, box-shadow .2s}
.feat button:hover,.feat button:focus-visible{transform:translateY(-4px);box-shadow:0 12px 20px rgba(0,0,0,.12)}
.feat button:focus-visible{outline:3px solid var(--navy)}
.feat h4{color:#fff;font-size:1.05rem;line-height:1.1;margin-bottom:10px}
.feat p{font-size:.7rem;line-height:1.45}
.feat .more{max-height:0;overflow:hidden;transition:max-height .3s;font-size:.72rem}
.feat button[aria-expanded="true"] .more{max-height:140px;margin-top:8px}
.feat .arr{position:absolute;right:12px;bottom:8px;font-size:1rem;transition:transform .2s}
.feat button[aria-expanded="true"] .arr{transform:rotate(90deg)}
.feat button:nth-child(1){background:#E7B341} .feat button:nth-child(2){background:#8DD3A0} .feat button:nth-child(3){background:#E2834C}
.news{background:#e8e8e8;border-radius:10px;padding:16px 28px;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.news h3{font-size:1.45rem}
.news form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.news input{border:0;border-radius:30px;padding:10px 18px;min-width:0;width:240px;max-width:100%}
.news .iconbtn{background:none;border:0;padding:4px}
.news .iconbtn svg{width:40px;height:40px;stroke:var(--navy);fill:none;stroke-width:1.4}
.news .msg{font-weight:600;color:var(--teal)}

.actors{padding-block:64px 30px}
.actors h2{font-size:clamp(2rem,3.4vw,2.9rem);margin-top:8px}
.actors .sub{margin-top:10px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.actor{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:26px 30px;color:#fff;min-height:220px;border:0;text-align:left;transition:transform .25s, box-shadow .25s;position:relative;overflow:hidden}
.actor:hover,.actor:focus-visible{transform:translateY(-4px);box-shadow:0 14px 28px rgba(0,0,0,.15)}
.actor h3{color:#fff;font-size:1.35rem;margin-bottom:10px}
.actor p{font-size:.78rem;line-height:1.55}
.actor img{width:100%;max-width:300px;justify-self:end;transition:transform .35s}
.actor:hover img{transform:scale(1.05) rotate(-1deg)}
.actor .go{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:.8rem;background:rgba(255,255,255,.25);border-radius:20px;padding:5px 14px}
.actor.fam{background:var(--a-fam)} .actor.est{background:var(--a-est)} .actor.doc{background:var(--a-doc)} .actor.ins{background:var(--a-ins)}
.band{background:#e8e8e8;border-radius:10px;padding:16px;text-align:center;margin-top:36px;width:100%;border:0;font-family:var(--display);font-weight:700;color:var(--navy);font-size:clamp(1.4rem,2.6vw,2rem);transition:background .2s}
.band:hover{background:var(--yellow-soft)}

.frame{padding-block:64px 50px;position:relative;overflow:hidden}
.frame::before,.frame::after{content:"";position:absolute;border-radius:50%;background:#efefef;z-index:-1}
.frame::before{width:240px;height:240px;left:52%;top:-120px} .frame::after{width:160px;height:160px;right:-60px;bottom:30px}
.frame h2{font-size:clamp(1.9rem,3.2vw,2.8rem);max-width:20ch;margin-top:8px}
.road{position:relative;margin-top:24px}
.road svg{width:100%;height:auto;display:block;overflow:visible}
.pin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;padding:0;width:clamp(44px,6vw,78px);transition:transform .25s}
.pin:hover,.pin.on{transform:translate(-50%,-112%) scale(1.08)}
.pin svg{width:100%;height:auto;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.pin .ico{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:38%}
.pin .ico svg{filter:none;stroke:#fff;fill:none;stroke-width:2}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 28px;margin-top:26px}
.step{all:unset;cursor:pointer;padding:6px 0 6px 12px;border-left:4px solid var(--c);border-radius:2px;transition:background .2s}
.step h4{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:.85rem}
.step p{font-size:.78rem;color:var(--muted);margin-top:4px}
.step.on{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,transparent),transparent)}
.step:focus-visible{outline:3px solid var(--navy)}

.contact{position:relative;overflow:hidden;padding-block:70px 90px}
.contact .shape{position:absolute;inset:0 0 0 16%;background:var(--yellow);opacity:.88;border-bottom-left-radius:60% 30%;border-top-left-radius:22% 50%}
.contact .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
.contact .card{background:rgba(255,255,255,.35);padding:44px 34px;border-radius:4px}
.contact h2{font-size:clamp(1.6rem,2.6vw,2.2rem)}
.contact h3{font-size:clamp(1.6rem,2.6vw,2.2rem);margin-top:6px}
.contact form{display:grid;gap:14px;margin-top:34px;max-width:420px}
.field{position:relative}
.field input,.field textarea{width:100%;border:0;border-radius:30px;background:#EC5B35;color:#fff;padding:10px 22px;font-weight:600;font-size:.85rem}
.field textarea{border-radius:18px;min-height:84px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#fff}
.field input:focus,.field textarea:focus{outline:3px solid var(--navy)}
.field .err{display:block;font-size:.75rem;color:#8a1c0e;margin:4px 0 0 18px;font-weight:600}
.contact .send{justify-self:start;background:var(--navy);color:#fff;border:0;border-radius:30px;padding:10px 30px;font-family:var(--display);font-weight:700}
.contact .ok{background:#fff;border-radius:16px;padding:18px;font-weight:600;color:var(--navy)}
.contact .art{position:relative}
.contact .art img{width:100%;max-width:560px;margin-left:auto;display:block}
.plane{position:absolute;width:60px;height:40px;fill:#e3e8ff;animation:fly 7s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(14px,-12px) rotate(4deg)}}
.social{display:flex;gap:14px;justify-content:flex-end;margin-top:20px;border-top:1px solid #d18b2b;padding-top:30px}
.social a{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--navy)}
.social svg{width:22px;height:22px;fill:#fff}
footer{text-align:center;font-size:.75rem;color:var(--muted);padding-block:18px}

/* ---------- LOGIN ---------- */
.login{background:linear-gradient(90deg,var(--rbg1),var(--rbg2));padding-block:64px;min-height:calc(100vh - 84px)}
.lcard{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1.08fr 1fr;box-shadow:0 20px 40px rgba(0,0,0,.12)}
.lleft{position:relative;background:#e4e4e2;overflow:hidden;text-align:center;padding:52px 20px 40px;color:#fff;min-height:540px}
.lleft::before{content:"";position:absolute;inset:-10% -20% 40% -10%;background:linear-gradient(135deg,var(--r1),var(--rbg2));opacity:.9;border-radius:0 0 60% 40%/0 0 50% 50%}
.lleft::after{content:"";position:absolute;width:70%;height:55%;right:-20%;top:20%;background:var(--r2);opacity:.25;border-radius:50%}
.lleft>*{position:relative;z-index:1}
.lleft h2{color:#fff;font-size:1.9rem}
.lleft p{font-size:.78rem;max-width:30ch;margin:6px auto 0}
.lleft .circ{width:min(270px,75%);aspect-ratio:1;margin:18px auto 0;filter:drop-shadow(0 8px 14px rgba(0,0,0,.14));animation:bob 5s ease-in-out infinite}
.lleft .circ img{width:100%;height:100%;object-fit:contain}
.cloud{position:absolute;left:8%;top:38%;width:90px;height:50px;background:#fff;border-radius:40px;z-index:1}
.cloud::before{content:"";position:absolute;width:50px;height:50px;border-radius:50%;background:#fff;left:22px;top:-24px}
.lright{position:relative;background:var(--r2);overflow:hidden;display:grid;place-items:center;padding:40px 28px}
.lright::before{content:"";position:absolute;width:120%;height:90%;left:8%;top:12%;border-radius:45% 55% 40% 60%;background:var(--r1);opacity:.35}
.lright form{position:relative;width:100%;max-width:260px;display:grid;gap:12px;color:#fff}
.lright h3{color:#fff;font-family:var(--body);font-weight:500;text-align:center;letter-spacing:.02em;font-size:1.1rem;margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:10px}
.lrow svg{width:16px;height:16px;fill:#fff;flex:none}
.lrow input{flex:1;min-width:0;border:0;padding:9px 10px;font-size:.8rem;color:var(--r2);border-radius:2px}
.lrow input::placeholder{color:var(--r2)}
.lmeta{display:flex;justify-content:space-between;font-size:.66rem;padding-left:26px;align-items:center}
.lmeta label{display:flex;gap:6px;align-items:center;cursor:pointer}
.lmeta input{accent-color:#fff}
.lmeta button{background:none;border:0;color:#fff;font-size:.66rem;padding:0}
.lmeta button:hover{text-decoration:underline}
.lsubmit{justify-self:center;margin-left:26px;background:var(--r1);filter:brightness(1.05);color:#fff;border:0;padding:6px 34px;font-size:.8rem;border-radius:2px;transition:transform .15s}
.t-est .lsubmit{background:#F59E0B}
.lsubmit:hover{transform:translateY(-1px)}
.lsign{justify-self:center;margin-left:26px;background:none;border:0;color:#fff;font-size:.8rem}
.lnote{font-size:.7rem;text-align:center;margin-left:26px;background:rgba(255,255,255,.18);padding:6px;border-radius:4px}
.lerr{font-size:.72rem;margin-left:26px;background:rgba(0,0,0,.25);padding:6px 8px;border-radius:4px}

/* ---------- STUDENT ---------- */
.kid{position:relative;overflow:hidden;background:linear-gradient(90deg,#FBC248,#F8B266 50%,#ECA36A);padding-block:40px 50px;min-height:calc(100vh - 84px)}
.kid::before{content:"";position:absolute;width:55%;height:120%;left:30%;top:30%;background:#F5A54A;border-radius:45%;opacity:.7}
.kid::after{content:"";position:absolute;width:45%;height:70%;right:-10%;top:-10%;background:#F2B079;border-radius:50%;opacity:.6}
.kid .wrap{position:relative;z-index:1}
.kgrid{display:grid;grid-template-columns:.62fr 1fr;gap:34px}
.kcard{background:#fff;border:14px solid #E8C47A;border-radius:48px;padding:26px 30px}
.kwelcome{text-align:center;display:flex;flex-direction:column;align-items:center}
.kwelcome h2{font-size:clamp(1.7rem,2.8vw,2.3rem)}
.kwelcome .cnt{color:#555;font-size:1.05rem;margin-top:4px}
.kwelcome img{width:min(240px,80%);margin:12px 0 10px;transition:transform .3s}
.kwelcome img:hover{transform:rotate(-3deg) scale(1.04)}
.kbtn{background:#B8643E;color:#fff;border:4px solid #E8C47A;border-radius:30px;padding:8px 34px;font-family:var(--display);font-weight:800;font-size:1.3rem;box-shadow:0 4px 0 #8d4b2c;transition:transform .1s, box-shadow .1s}
.kbtn:hover{transform:translateY(-2px)}
.kbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #8d4b2c}
.kbtn[disabled]{opacity:.5;cursor:not-allowed}
.adv{position:relative}
.adv h2{font-size:clamp(1.6rem,2.8vw,2.3rem)}
.adv .t1{color:#7a3a1d;font-size:1.1rem;margin-top:4px}
.adv .t2{font-size:.8rem;font-weight:600}
.speak{position:absolute;right:22px;top:20px;width:38px;height:38px;border:0;border-radius:10px;background:#B8643E;display:grid;place-items:center;transition:transform .15s}
.speak:hover{transform:scale(1.08)}
.speak svg{width:20px;height:20px;fill:#fff}
.speak.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(184,100,62,.25)}}
.bar{margin-top:22px;height:58px;border-radius:40px;background:#6f3a24;border:8px solid #b8643e;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:#DE8A3A;border-radius:40px;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.bar svg{position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(-30deg);width:38px;height:38px}
.map{position:relative;margin-top:16px;aspect-ratio:1000/436}
.map img{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:radial-gradient(ellipse 52% 54% at 50% 52%,#000 80%,transparent 100%);mask-image:radial-gradient(ellipse 52% 54% at 50% 52%,#000 80%,transparent 100%)}
.lvl{position:absolute;transform:translate(-50%,-50%);width:8.2%;aspect-ratio:1;border-radius:50%;border:3px solid #3a1d10;background:radial-gradient(circle at 35% 30%,#8a4b33,#4a2316);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(.9rem,2vw,1.6rem);box-shadow:0 4px 6px rgba(0,0,0,.35);transition:transform .2s}
.lvl svg{width:46%;fill:#e9e2dc}
.lvl.open{background:radial-gradient(circle at 35% 30%,#ef4b4b,#a0101a);border-color:#7a0710;animation:glow 1.6s infinite}
.lvl.done{background:radial-gradient(circle at 35% 30%,#7fd36b,#2c8a3e);border-color:#1f6a2d}
.lvl:hover{transform:translate(-50%,-50%) scale(1.12)}
.lvl.shake{animation:shake .4s}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(255,255,255,.45)}}
@keyframes shake{25%{transform:translate(-56%,-50%)}75%{transform:translate(-44%,-50%)}}
.bag{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:20px;z-index:2;width:76px;height:76px;border-radius:50%;border:6px solid #F6B566;background:radial-gradient(circle,#fff 40%,#fbe2bf);display:grid;place-items:center;font-size:34px;box-shadow:0 6px 14px rgba(0,0,0,.15);transition:transform .2s}
.bag:hover{transform:scale(1.08) rotate(-6deg)}
.bag b{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;border-radius:20px;font-size:.75rem;min-width:24px;padding:2px 6px}
.qcard{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:center;max-width:900px;margin:10px auto 0;position:relative}
.qcard img{width:100%;max-width:300px;justify-self:center}
.qcard h2{font-size:clamp(1.25rem,2.3vw,1.9rem);line-height:1.15}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:930px;margin:34px auto 0}
.opt{background:#B8643E;color:#fff;border:8px solid #F7BE62;border-radius:34px;padding:14px 10px;font-family:var(--display);font-weight:700;font-size:clamp(.85rem,1.3vw,1.05rem);line-height:1.2;min-height:120px;transition:transform .15s, background .2s, border-color .2s}
.opt:hover{transform:translateY(-3px)}
.opt[aria-pressed="true"]{background:#7a3a1d;border-color:#fff;transform:translateY(-3px) scale(1.03)}
.opt.good{background:#2f9e5a;border-color:#c8f2d4}
.opt.meh{background:#a0682e}
.feedback{max-width:760px;margin:22px auto 0;background:#fff;border-radius:22px;padding:14px 22px;font-weight:600;text-align:center;color:var(--navy)}
.qnav{display:flex;align-items:center;justify-content:space-between;max-width:700px;margin:28px auto 0;gap:20px}
.qnav .lnk{background:none;border:0;color:#fff;text-decoration:underline;font-family:var(--display);font-weight:800;font-size:1.3rem;opacity:.85}
.qnav .lnk:hover{opacity:1}
.next{background:linear-gradient(90deg,#E07F33,#F64C1A);color:#fff;border:0;border-radius:40px;padding:12px 70px;font-family:var(--display);font-weight:800;font-size:1.7rem;transition:transform .15s, opacity .2s}
.next[disabled]{background:#E7B23E;opacity:.75;cursor:not-allowed}
.next:not([disabled]):hover{transform:scale(1.04)}
.badge img{max-width:220px;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- DASHBOARDS ---------- */
.dash{display:grid;grid-template-columns:226px 1fr;min-height:calc(100vh - 84px);background:linear-gradient(90deg,var(--rbg1),var(--rbg2))}
.side{background:var(--rside);color:#fff;padding:60px 26px 30px 50px;padding-left:max(26px, env(safe-area-inset-left, 0px))}
.side h4{color:#fff;font-size:1.15rem;margin:0 0 20px;letter-spacing:.02em}
.side h4+ul{margin-bottom:40px}
.side ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.side button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;font-size:.9rem;padding:4px 8px;margin-left:-8px;border-radius:8px;transition:background .15s}
.side button:hover,.side button.on{background:rgba(255,255,255,.18)}
.side button:focus-visible{outline:2px solid #fff}
.side svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.3;flex:none}
.main{padding:34px clamp(16px,3vw,40px) 40px;padding-right:max(16px, env(safe-area-inset-right, 0px));min-width:0}
.panel{background:rgba(255,255,255,.6);border-radius:4px;padding:10px clamp(16px,4vw,60px) 40px;min-height:100%}
.panel>section{padding-block:22px;border-bottom:1px solid #b9c2c2}
.panel>section:last-child{border-bottom:0}
.hi{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.hi h1{font-size:clamp(1.9rem,3.4vw,2.6rem);color:var(--rtext)}
.hi span{font-weight:600;color:#555;font-size:.9rem}
.panel h2{font-size:1.45rem;margin-bottom:18px;color:var(--rtext)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:26px}
.course{position:relative;border:1px solid #666;border-radius:16px;background:#eceeed;padding:30px 12px 12px;overflow:hidden;text-align:left;transition:transform .2s, box-shadow .2s}
.course::before{content:"";position:absolute;right:0;top:0;width:60%;height:62%;background:#617a70;border-bottom-left-radius:100% 100%}
.course::after{content:"";position:absolute;right:0;top:0;width:60%;height:62%;background:#eceeed;border-top-right-radius:100% 100%;transform:translate(-1px,1px) scale(1)}
.course>*{position:relative;z-index:1}
.course:hover{transform:translateY(-3px);box-shadow:0 10px 18px rgba(0,0,0,.12)}
.course small{font-size:.72rem;color:#333}
.course strong{display:block;font-family:var(--display);font-size:1.9rem;line-height:1;color:var(--navy)}
.course .pct{font-size:.55rem;text-align:right;margin-top:4px}
.course .pb{height:7px;border-radius:6px;background:#c8cccb;overflow:hidden}
.course .pb i{display:block;height:100%;background:#4CB487;transition:width .5s}
.course .st{display:flex;align-items:center;gap:8px;font-size:.68rem;margin-top:10px}
.course .st b{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.6rem}
.course.add{display:grid;place-items:center;min-height:128px;border-color:#ddd;background:#e8e9e9;cursor:pointer}
.course.add::before{background:#c9cccb}
.course.add .plus{width:38px;height:38px;border-radius:50%;border:1.5px solid #bbb;display:grid;place-items:center;font-size:28px;color:#bbb;font-weight:300}
.course.add:hover .plus{border-color:var(--r2);color:var(--r2)}
.newform{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.newform input{border:1px solid #bbb;border-radius:20px;padding:7px 14px;width:150px}
.newform button{border:0;border-radius:20px;padding:7px 18px;background:var(--r2);color:#fff;font-weight:600}
.trains{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}
.train{background:#efeff0;border-radius:12px;padding:18px 22px;display:grid;grid-template-columns:138px 1fr;gap:20px;align-items:center}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center}
.thumb .play i{width:48px;height:48px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;transition:transform .2s, background .2s}
.thumb:hover .play i{transform:scale(1.1);background:rgba(255,255,255,.25)}
.thumb .play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.train h3{font-size:1.15rem;line-height:1.05}
.train .s{border-bottom:1px solid #aaa;padding-bottom:6px;margin-bottom:6px;font-size:.92rem}
.train .d{font-size:.6rem;line-height:1.35;color:#333}
.train .meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;font-size:.85rem}
.train .meta svg{width:14px;height:14px;stroke:#333;fill:none;stroke-width:1.5}
.prog{flex:1;height:14px;border-radius:10px;background:#cfcfcf;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--r2) 65%,#999);border-radius:10px;transition:width .6s}
.prog span{position:relative;font-size:.5rem;padding-left:16px;line-height:14px;display:block;color:#222}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 30px}
.tool{background:#efeff0;border-radius:16px;padding:12px 12px 10px;position:relative}
.tool h4{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--navy)}
.tool p{font-size:.68rem;border-bottom:1px solid #aaa;padding-bottom:6px}
.tool .acts{display:flex;justify-content:space-around;margin-top:6px}
.tool .acts button{background:none;border:0;padding:4px;border-radius:6px}
.tool .acts button:hover{background:rgba(0,0,0,.06)}
.tool .acts svg{width:15px;height:15px;stroke:#333;fill:none;stroke-width:1.5}
.tool .acts button[aria-pressed="true"] svg{stroke:var(--r2);fill:color-mix(in srgb,var(--r2) 35%,transparent)}
.tool .info{position:absolute;top:-12px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--rtext);color:#fff;border:2px solid #fff;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.chart{background:#fff;border-radius:26px;padding:12px 16px 14px}
.chart h3{font-family:var(--display);font-weight:700;color:var(--rtext);font-size:1.15rem;margin:4px 0 2px}
.chart small{color:#9c8aa8}
.chart svg{width:100%;height:auto;display:block}
.route{background:#fff;border-radius:20px;padding:16px 18px}
.route h3{font-family:var(--body);font-weight:500;color:#77628a;font-size:1rem;margin-bottom:12px}
.route div{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px;font-size:.72rem;color:#333;border-bottom:1px solid #eee;padding-block:7px}
.route b{height:6px;background:#ebe7f1;border-radius:4px;position:relative;overflow:hidden}
.route b i{position:absolute;inset:0 auto 0 0;background:#A38BBE;transition:width .6s}
.seg{display:flex;gap:20px;margin-top:22px;justify-content:center}
.seg button{background:#fff;border:0;border-radius:18px;padding:10px 20px;font-family:var(--display);font-weight:700;color:var(--rtext);font-size:1rem;transition:background .2s, color .2s}
.seg button[aria-pressed="true"]{background:var(--rtext);color:#fff}
.legend{display:flex;gap:16px;font-size:.7rem;color:#555;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- MODAL / TOAST ---------- */
.modal{position:fixed;inset:0;background:rgba(14,34,51,.45);display:grid;place-items:center;z-index:90;padding:20px}
.mbox{background:#fff;border-radius:28px;max-width:520px;width:100%;padding:28px;position:relative;max-height:85vh;overflow:auto}
.mbox h3{font-size:1.4rem;margin-bottom:12px}
.mbox .x{position:absolute;right:14px;top:12px;background:none;border:0;font-size:1.6rem;line-height:1;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:14px;margin-top:10px}
.badges div{text-align:center;font-size:.72rem;font-weight:600}
.badges span{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 6px;border-radius:50%;background:var(--yellow-soft);font-size:34px}
.badges .lock span{background:#eee;filter:grayscale(1);opacity:.5}
.reads{display:grid;gap:10px}
.reads button{display:flex;justify-content:space-between;gap:12px;text-align:left;background:var(--paper);border:0;border-radius:14px;padding:12px 16px}
.reads button:hover{background:var(--yellow-soft)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:30px;z-index:95;font-weight:600;font-size:.9rem;box-shadow:0 10px 24px rgba(0,0,0,.2);animation:up .25s}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}

/* ---------- RESPONSIVE ---------- */
@media (max-width: 1020px){
  .tab{min-width:0;padding-inline:12px;font-size:.85rem}
  .pill{min-width:0;padding-right:18px}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{grid-template-columns:repeat(2,1fr)}
}
@media (max-width: 860px){
  .menu-toggle{display:block}
  .nav .wrap{flex-wrap:wrap;align-items:center;min-height:70px}
  .logo{padding-bottom:0}.logo img{height:46px}
  .tabs{order:3;flex-basis:100%;flex-direction:column;align-items:stretch;display:none;padding-bottom:12px}
  .nav.open .tabs{display:flex}
  .tab{height:auto;padding:12px;justify-content:flex-start;border-radius:10px}
  .tab::before{inset:0;clip-path:none;border-radius:10px}
  .tab::after{display:none}
  .nav-right{margin-left:auto;padding-bottom:0}
  .usermenu{top:66px}
  .hero .wrap,.reto,.contact .wrap,.kgrid,.lcard,.stats,.dash,.qcard{grid-template-columns:1fr}
  .hero p{margin-top:26px}
  .hero-art{max-width:480px;width:100%;margin:0 auto}
  .pillars,.feat{grid-template-columns:1fr}
  .reto .photo{min-height:280px}
  .agrid{grid-template-columns:1fr}
  .contact .shape{inset:30% 0 0 0;border-radius:40% 40% 0 0/12% 12% 0 0}
  .lleft{min-height:auto}
  .side{padding:20px max(16px, env(safe-area-inset-left, 0px));display:flex;gap:30px;overflow-x:auto}
  .side h4{margin-bottom:10px;font-size:.95rem}.side h4+ul{margin-bottom:0}
  .side>div{min-width:max-content}
  .road{display:none}
}
@media (max-width: 520px){
  .actor{grid-template-columns:1fr}
  .actor img{justify-self:center;max-width:230px}
  .steps{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr;gap:14px}
  .opt{min-height:0}
  .next{padding:10px 36px;font-size:1.3rem}
  .qnav .lnk{font-size:1rem}
  .train{grid-template-columns:1fr}
  .thumb{max-width:180px}
  .nav-right .link-btn{display:none}
  .pill{padding:4px 14px 4px 4px;gap:8px;font-size:.85rem}
  .kcard{border-width:10px;border-radius:32px;padding:20px}
  .bag{width:60px;height:60px;font-size:26px}
}
</style>
</head>
<body>

  <div class="wrap">
    <button class="logo" data-go="inicio" aria-label="Te Reto, ir al inicio"><img src="assets/logo.png" alt="Te Reto"></button>
    <nav class="tabs" id="tabs" aria-label="Principal"></nav>
    <div class="nav-right" id="navRight"></div>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div class="usermenu" id="userMenu" hidden></div>
</header>

<main id="view"></main>

<script>
/* ---------- icons ---------- */
const I = {

  headset:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M4 14h3v6H4zM17 14h3v6h-3z"/></svg>',

function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><button class="x" aria-label="Cerrar">×</button>${html}</div>`;document.body.appendChild(m);
  const close=()=>{m.remove();document.removeEventListener('keydown',esc)};const esc=e=>{if(e.key==='Escape')close()};
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('.x'))close()});document.addEventListener('keydown',esc);$('.x',m).focus();return m}
let speaking=null;
function speak(text,btn){
  try{
    const sy=window.speechSynthesis; if(!sy){toast('Tu navegador no puede leer en voz alta');return}
    if(speaking===btn){sy.cancel();btn.classList.remove('on');speaking=null;return}
    sy.cancel(); document.querySelectorAll('.speak.on').forEach(b=>b.classList.remove('on'));
    const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.95;
    u.onend=()=>{btn.classList.remove('on');speaking=null};
    btn.classList.add('on');speaking=btn;sy.speak(u);
  }catch(e){toast('Tu navegador no puede leer en voz alta')}
}
function go(r){ if(location.hash!=='#'+r){location.hash=r}else{render()} }

/* ---------- nav ---------- */
function renderNav(route){
  const role = APP_ROLE[route];
  const nav = $('#nav'); nav.classList.remove('open'); $('#menuToggle').setAttribute('aria-expanded','false'); $('#userMenu').hidden=true;
  let tabs, right;
  document.body.className = role ? ROLES[role].t+' app' : (ROLES[route]?ROLES[route].t:'');
  if(role==='estudiantes'){
    tabs=[['adan','Inicio'],['retos','Mis Retos'],['lecturas','Lecturas']];
    right=`<button class="pill" id="pill" aria-haspopup="true"><span class="av">${I.user}</span>Adán</button>`;
  } else {
    tabs=[];
    right = role ? `<button class="pill" id="pill" aria-haspopup="true"><span class="av">${I.user}</span>${ROLES[role].user}</button>`
                 : `<button class="link-btn" id="signupBtn">Registrarse</button>
                    <div class="enter"><button class="pill" id="enterBtn" aria-haspopup="true" aria-expanded="false" aria-controls="enterMenu"><span class="av">${I.user}</span>Iniciar<span class="chev">${I.chev}</span></button>
                    <div class="enter-menu" id="enterMenu" hidden>
                      ${ENTER.map(([r,ic,t,s])=>`<button data-go="${r}"><span class="ic"><img src="assets/mini-${r}.png" alt=""></span><span><b>${t}</b><small>${s}</small></span></button>`).join('')}
                      <p class="enter-foot">¿No tienes cuenta? <button class="link-btn" id="signupBtn2">Registrarse</button></p>
                    </div></div>`;
  }
  const active = route==='adan'||route==='reto'||route==='insignia' ? 'adan' : route;
  $('#tabs').innerHTML = tabs.map(([r,l])=>`<button class="tab" data-go="${r}" ${r===active?'aria-current="page"':''}><span>${l}</span></button>`).join('');
  $('#menuToggle').hidden = !tabs.length;
  $('#navRight').innerHTML = right;
  const eb=$('#enterBtn');
  if(eb){
    const menu=$('#enterMenu'), setOpen=o=>{menu.hidden=!o;eb.setAttribute('aria-expanded',o);if(o)menu.querySelector('button').focus()};
    eb.onclick=e=>{e.stopPropagation();setOpen(menu.hidden)};
    menu.addEventListener('keydown',e=>{if(e.key==='Escape'){setOpen(false);eb.focus()}});
    $('#signupBtn').onclick=$('#signupBtn2').onclick=()=>{setOpen(false);chooseSignup()};
  }
  const pill=$('#pill'); if(pill){pill.onclick=()=>{const m=$('#userMenu');m.hidden=!m.hidden;
    m.innerHTML=`<button data-go="${ROLES[role].home}">Mi panel</button><button id="logout">Cerrar sesión</button>`;
    $('#logout').onclick=()=>{m.hidden=true;toast('Sesión cerrada');go(role)}}}
}
$('#menuToggle').onclick=()=>{const n=$('#nav');n.classList.toggle('open');$('#menuToggle').setAttribute('aria-expanded',n.classList.contains('open'))};
document.addEventListener('click',e=>{
  const em=$('#enterMenu'); if(em&&!em.hidden&&!e.target.closest('.enter')){em.hidden=true;$('#enterBtn').setAttribute('aria-expanded','false')}
  const g=e.target.closest('[data-go]'); if(!g) return;
  const r=g.dataset.go;
  if(r==='retos'){go('adan');setTimeout(()=>$('#map')?.scrollIntoView({behavior:'smooth',block:'center'}),60);return}
  if(r==='lecturas'){openReadings();return}
  go(r);
});

function smooth(pts){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function chartSvg(seg){
  const W=480,H=170,x0=0,months=['Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic','Ene'];
  const pts=arr=>arr.map((v,i)=>[x0+i*(W/(arr.length-1)),H-(v/100)*H]);
  const s=SERIES[seg], A=pts(s.a), B=pts(s.b);
  let grid='';for(let i=0;i<=12;i++)grid+=`<line x1="${i*W/12}" y1="0" x2="${i*W/12}" y2="${H}" stroke="#E7D3EE"/>`;for(let j=0;j<=5;j++)grid+=`<line x1="0" y1="${j*H/5}" x2="${W}" y2="${j*H/5}" stroke="#E7D3EE"/>`;
  return `<svg viewBox="-28 -6 ${W+36} ${H+26}" role="img" aria-label="Participación mensual de ${seg}">
    ${grid}${[0,50,100].map(v=>`<text x="-6" y="${H-v/100*H+3}" font-size="9" text-anchor="end" fill="#8a7b96">${v}%</text>`).join('')}
    <path d="${smooth(A)} L${W},${H} L0,${H} Z" fill="#cfcbd3" fill-opacity=".6"/><path d="${smooth(A)}" fill="none" stroke="#a8a2ad" stroke-width="2"/>
    <path d="${smooth(B)} L${W},${H} L0,${H} Z" fill="#9C80BE" fill-opacity=".35"/><path d="${smooth(B)}" fill="none" stroke="#8A63BD" stroke-width="2.4"/>
    ${months.map((m,i)=>`<text x="${i*W/11}" y="${H+15}" font-size="9" text-anchor="middle" fill="#8a7b96">${m}</text>`).join('')}
  </svg>`;
}

      <div class="chart"><h3>Evolución de la Ruta</h3><small>Estadísticas · participación en el plan de inclusión</small><div id="chartBox">${chartSvg(S.insSeg)}</div>
        <div class="legend"><span><i style="background:#8A63BD"></i>Este año</span><span><i style="background:#a8a2ad"></i>Año anterior</span></div></div>
      <div><div class="route" id="sec-route"><h3>Ruta de Seguimiento</h3>
        ${[['Preescolar',48],['Primaria',72],['Bachillerato',68]].map(([n,p])=>`<div><span>${n}</span><b title="${p}%"><i style="width:${p}%"></i></b></div>`).join('')}</div>
        <div class="seg" role="group" aria-label="Ver datos de"><button aria-pressed="${S.insSeg==='docentes'}" data-seg="docentes">Docentes</button><button aria-pressed="${S.insSeg==='estudiantes'}" data-seg="estudiantes">Estudiantes</button></div>
      </div>
    </div></section>
    <section id="sec-tools"><h2>Herramientas Institucionales</h2>
      ${toolsHtml([['Bienestar Familiar','Rutas de apoyo'],['Leyes','Ley 1752 de 2015'],['Decreto','Decreto 1075 de 2015'],['Norma','Ley 2628 de 2026',true],['Foros','Comparte intercolegial']],'ins')}
    </section>
  </div></div></div>`;
  bindSide({'Estadísticas':'#sec-stats','Seguimientos':'#sec-route','Protocolos':'#sec-tools','Rutas':'#sec-route'}); bindTools();
  document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{S.insSeg=b.dataset.seg;document.querySelectorAll('[data-seg]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#chartBox').innerHTML=chartSvg(S.insSeg)});
}

/* ---------- router ---------- */
function render(){
  const r=(location.hash||'#inicio').slice(1);
  try{window.speechSynthesis?.cancel()}catch(e){} speaking=null;
  renderNav(r);
  if(ROLES[r]) login(r);
  else if(r==='adan') kidHome();
  else if(r==='reto') kidReto();
  else if(r==='insignia') kidBadge();
  else if(r==='alberto') teacher();
  else if(r==='maria') family();
  else if(r==='colegio') institution();
  else { renderNav('inicio'); landing(); }
  if(r!=='inicio'||!location.hash) window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
